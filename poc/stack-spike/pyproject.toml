# Tool configuration only. The PoC is not an installable package.

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers -p no:cacheprovider"
markers = [
    "db: needs the running PostgreSQL service (POC_ADMIN_DSN, POC_APP_DSN)",
    "stack: needs the running infrastructure services (db, valkey, model)",
    "model: needs the opt-in model profile (CHECK_MODEL=1)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = "/tmp/.ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
