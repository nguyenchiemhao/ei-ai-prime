# ei-ai local integration environment (EA-13 / SET-03). One command: npm run up
#
#   npm run up                  core services + the ~4B model (profiles core + model)
#   npm run up -- --no-model    without the model (no 2.5 GB download, ~1.5 GB less RAM)
#   npm run up -- --demo        also the demo profile (host-demo, hr-api-mock) once those tickets exist
#
# Credentials come from .env (created by `npm run up`, git-ignored); there is no password in this file.
# Written for Docker Compose >= 2.20.3 (scripts/lib/compose-version.mjs): profiles, healthcheck
# conditions, mem_limit and named volumes only (no include:, develop: or healthcheck.start_interval).
# Every long-running service has a healthcheck and a hard memory limit (16 GB dev machine, NFR).

name: ei-ai

# One default for the model alias, used by the start script. The healthcheck below repeats the same
# default (a YAML anchor cannot be expanded inside a string); compose.test.mjs keeps the two equal.
x-llm-alias: &llm_alias "${LLM_ALIAS:-qwen3-4b-instruct-2507}"

services:
  # PostgreSQL 16 + pgvector 0.8.x. The init scripts create the application role ei_ai_app (never a
  # superuser, never BYPASSRLS, never an owner), the migration/owner role ei_ai_migrator and the sign-in
  # lookup role ei_ai_signin. Tables, grants and RLS policies come from the Alembic migrations
  # (service "migrate").
  db:
    image: pgvector/pgvector:0.8.7-pg16
    profiles: ["core"]
    environment:
      POSTGRES_DB: ei_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run npm run up to create .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?run npm run up to create .env}
      # Only for the first-start init script that creates ei_ai_migrator.
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?run npm run up to create .env}
      # Only for the first-start init script that creates the sign-in lookup role ei_ai_signin (EA-22).
      SIGNIN_DB_PASSWORD: ${SIGNIN_DB_PASSWORD:?run npm run up to create .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ei_ai"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g

  # Valkey 8 (BSD-3-Clause, Redis wire-compatible): rate limits and short-lived counters.
  # Internal network only, no authentication in the local environment.
  valkey:
    image: valkey/valkey:8.1.10-alpine
    profiles: ["core"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m

  # llama.cpp server: OpenAI-compatible endpoint, ~4B model on CPU. Multi-GB download on first start.
  # infra/model/start-model.sh (EA-24) downloads the file by Hugging Face revision (commit, not branch)
  # when it is missing, refuses to start when its sha256 differs from LLM_MODEL_SHA256, and serves it as
  # "<LLM_ALIAS>@sha256-<first 12 hex of the file's actual sha256>" (hashing adds ~5-15 s per start).
  # The Model Gateway calls exactly that id, so a newer build can never answer for a pinned one (D18).
  model:
    image: ghcr.io/ggml-org/llama.cpp:server-b11580
    profiles: ["model"]
    entrypoint: ["/bin/sh", "/opt/ei-ai/start-model.sh"]
    environment:
      LLM_MODEL_FILE: ${LLM_MODEL_FILE:-Qwen3-4B-Instruct-2507-Q4_K_M.gguf}
      LLM_MODEL_URL: ${LLM_MODEL_URL:-https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/a06e946bb6b655725eafa393f4a9745d460374c9/Qwen3-4B-Instruct-2507-Q4_K_M.gguf}
      LLM_MODEL_SHA256: ${LLM_MODEL_SHA256:-3605803b982cb64aead44f6c1b2ae36e3acdb41d8e46c8a94c6533bc4c67e597}
      LLM_ALIAS: *llm_alias
    volumes:
      - model-cache:/models
      - ./infra/model:/opt/ei-ai:ro
    healthcheck:
      # Healthy only when /v1/models lists the checksummed alias, i.e. the verified model is loaded.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/models | grep -q '\"id\":\"${LLM_ALIAS:-qwen3-4b-instruct-2507}@sha256-'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 600s
    mem_limit: 6g

  api:
    build:
      context: ./backend
      target: runtime
    profiles: ["core"]
    environment:
      EI_AI_ENV: local
      DATABASE_URL: postgresql://ei_ai_app:${APP_DB_PASSWORD:?run npm run up to create .env}@db:5432/ei_ai
      # Sign-in lookup role (EA-22, R42): reads only users(id, org_id, email); used only by
      # ei_ai.auth.directory to find the Organization of an email at sign-in.
      SIGNIN_DATABASE_URL: postgresql://ei_ai_signin:${SIGNIN_DB_PASSWORD:?run npm run up to create .env}@db:5432/ei_ai
      VALKEY_URL: redis://valkey:6379/0
      # Base of the one-time set-password links printed by the Platform Operator CLI (FND-04);
      # follows the admin host port (ADMIN_PORT in .env, default 3000).
      ADMIN_BASE_URL: http://localhost:${ADMIN_PORT:-3000}
      # The admin nginx is the only proxy in front of the API: trust its X-Forwarded-For (EA-22).
      TRUST_PROXY_HEADERS: "true"
      # Model Gateway (EA-24): the local llama.cpp server on the internal network (no egress proxy).
      # No EGRESS_PROXY_URL yet (FND-10): cloud model calls are refused (CLOUD_NOT_CONFIGURED).
      MODEL_LOCAL_BASE_URL: http://model:8080/v1
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    # An OOM kill under the limit must not leave the API down.
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    profiles: ["core"]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 64m

  widget:
    build:
      context: .
      dockerfile: apps/widget/Dockerfile
    profiles: ["core"]
    ports:
      - "127.0.0.1:3001:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 64m

  # Lint, type check and test runner for the backend. Not started by "up"; used by
  # `npm run backend -- <task>` through "run --rm". The repository is mounted so edits are tested at once.
  backend-tools:
    build:
      context: ./backend
      target: dev
    profiles: ["tools"]
    working_dir: /workspace/backend
    volumes:
      - ./:/workspace
    environment:
      EI_AI_ENV: test
      EI_AI_REPO_ROOT: /workspace
      DATABASE_URL: postgresql://ei_ai_app:${APP_DB_PASSWORD:?run npm run up to create .env}@db:5432/ei_ai
      # Owner role: integration tests use it for fixture cleanup and for the schema guard negative tests.
      MIGRATION_DATABASE_URL: postgresql://ei_ai_migrator:${MIGRATION_DB_PASSWORD:?run npm run up to create .env}@db:5432/ei_ai
      # Sign-in lookup role: the API settings need it; the proof tests connect with it.
      SIGNIN_DATABASE_URL: postgresql://ei_ai_signin:${SIGNIN_DB_PASSWORD:?run npm run up to create .env}@db:5432/ei_ai
      VALKEY_URL: redis://valkey:6379/0
      MODEL_LOCAL_BASE_URL: http://model:8080/v1

  # One-shot database migration: "ei-ai db upgrade" (Alembic to head, then the schema guard). Not started
  # by "up" itself: npm run up / npm run migrate / test-integration run it explicitly after db is healthy.
  # With the backend test container it is the only service that holds the owner credentials; the API never does.
  migrate:
    build:
      context: ./backend
      target: runtime
    profiles: ["tools"]
    command: ["ei-ai", "db", "upgrade"]
    environment:
      EI_AI_ENV: local
      MIGRATION_DATABASE_URL: postgresql://ei_ai_migrator:${MIGRATION_DB_PASSWORD:?run npm run up to create .env}@db:5432/ei_ai
    depends_on:
      db:
        condition: service_healthy
        # db is in profile "core"; "required: false" lets commands that enable only the "tools"
        # profile (build, backend tasks) load the project. The migrate step runs with both profiles.
        required: false
    mem_limit: 256m

  # Profile "demo" (npm run up -- --demo) is reserved for later tickets; nothing runs there yet:
  #   host-demo    WGT-10 (EA-49): two host sites on 127.0.0.1:4001 and 127.0.0.1:4002
  #   hr-api-mock  SKL-04 (EA-63): HR API mock, internal network only

volumes:
  db-data:
  # Shared across projects on purpose (the model is ~2.5 GB). Never delete it with `down -v`.
  # Reuse a cached model: MODEL_CACHE_VOLUME=ei-ai-stack-spike_model-cache in .env.
  model-cache:
    name: ${MODEL_CACHE_VOLUME:-ei-ai-model-cache}
