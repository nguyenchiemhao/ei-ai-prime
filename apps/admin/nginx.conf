server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Server level, so every location inherits them. nginx drops these in a location that sets any
  # add_header of its own: such a location must repeat all of them (scripts/checks/admin-nginx).
  add_header X-Content-Type-Options nosniff always;
  # The sign-in and set-password forms must not be framed by another site (clickjacking).
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header Referrer-Policy no-referrer always;

  # Same-origin API for the browser: /api/healthz -> http://api:8000/healthz
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri /index.html;
  }
}
