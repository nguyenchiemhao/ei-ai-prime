[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ei-ai"
version = "0.0.0"
description = "ei-ai backend: API, readiness and the demo seed CLI."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "psycopg[binary]==3.3.6",
  "sqlalchemy[asyncio]==2.1.4",
  "alembic==1.20.0",
  "redis==8.1.0",
  "argon2-cffi==25.1.0",
  "anyio==4.15.1",
  "openai==3.29.0",
  "httpx2==2.15.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1",
  "ruff==0.17.0",
  "mypy==2.4.0",
]

[project.scripts]
ei-ai = "ei_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ei_ai.seed" = ["data/*.json"]
"ei_ai.model_gateway" = ["data/*.json"]
"ei_ai.db.migrations" = ["script.py.mako"]

[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = "/tmp/.ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ei_ai", "support"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
cache_dir = "/tmp/.mypy_cache"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs the Compose stack (db, valkey); run with -m integration",
  "isolation: tenant-isolation suite (FND-02); run with npm run backend -- test-isolation",
  "benchmark: overhead measurements (FND-01 RLS, EA-24 gateway); npm run backend -- bench-rls / bench-gateway",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -p no:cacheprovider"

[tool.coverage.run]
source = ["ei_ai"]
# Migrations are exercised by the integration tests, which run without coverage.
omit = ["*/ei_ai/db/migrations/*"]

[tool.coverage.report]
fail_under = 70
