<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#16181D;background:#F7F7F8}
a{color:#2346C7}a:hover{color:#1D3BAA}

<main style="min-height: 100vh; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 48px 16px; background: #F7F7F8">
  <div style="width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 36px; height: 36px; border-radius: 9px; background: #16181D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500">ei</div>
      <div style="font-weight: 600; font-size: 20px">ei-ai</div>
    </div>

    <form style="display: flex; flex-direction: column; gap: 18px; padding: 32px; background: #FFFFFF; border: 1px solid #E1E4E8; border-radius: 14px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-size: 24px; font-weight: 600">Sign in</h1>
        <p style="font-size: 14px; color: #555E6B">Use and manage your organization's assistants.</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="em" style="font-size: 13px; font-weight: 500">Work email</label>
        <input id="em" type="email" value="minh.pham@mekongdevworks.example" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #8A929C; border-radius: 8px; font-size: 14px">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <label for="pw" style="font-size: 13px; font-weight: 500">Password</label>
          <a href="#" style="font-size: 13px">Forgot password?</a>
        </div>
        <input id="pw" type="password" value="xxxxxxxxxxxx" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #8A929C; border-radius: 8px; font-size: 14px">
      </div>
      <a href="Dashboard.dc.html" style="min-height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #2346C7; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none">Sign in</a>
      <div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px dashed #C9CED4; border-radius: 10px; font-size: 13px; line-height: 1.5; color: #3F4752">
        <span style="flex: none; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: #EEF0F3; color: #3F4752">Later</span>
        <span>2-step verification (authenticator app) required for Org Owner, Org Admin and Developer roles.</span>
      </div>
    </form>

    <p style="font-size: 13px; color: #555E6B; text-align: center">Accounts are created by your organization admin.</p>
  </div>
</main>
